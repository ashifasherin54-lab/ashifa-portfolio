<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ashifa Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons (CDN) -->

</head>



<body>

    <script src="https://unpkg.com/lucide@latest"></script>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    <div class="grain-overlay"></div>
    <!-- <div class="content-wrapper"> -->
    <!-- Header -->
    <header class="header">
        <div class="container header-content">
            <a href="" class="logo">ASHIFA.</a>
            <nav class="nav-container">
                <ul class="nav-menu">
                    <li>
                        <a href="index.html#home" aria-label="Home">
                            <span class="desktop-text">Home</span>
                            <i data-lucide="home" class="mobile-icon"></i>
                        </a>
                    </li>
                    <li>
                        <a href="index.html#about" aria-label="About">
                            <span class="desktop-text">About</span>
                            <i data-lucide="user" class="mobile-icon"></i>
                        </a>
                    </li>
                    <li>
                        <a href="index.html#service" aria-label="Services">
                            <span class="desktop-text">Service</span>
                            <i data-lucide="briefcase" class="mobile-icon"></i>
                        </a>
                    </li>
                    <li>
                        <a href="contact.html" class="active" aria-label="Contact">
                            <span class="desktop-text">Contact</span>
                            <i data-lucide="mail" class="mobile-icon"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="contact.html" class="btn btn-outline">Available to work</a>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                    <span class="hamburger-box">
                        <span class="hamburger-inner"></span>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div style="padding-top: 150px;"></div>
        <!-- Modern Studio Contact Section -->
        <section id="contact" class="studio-contact">
            <!-- Backdrop Large Text -->
            <div class="studio-bg-text">CONTACT</div>

            <div class="container studio-container">
                <div class="studio-grid">
                    <!-- Left: Info & Branding -->
                    <div class="studio-info-side">
                        <div class="studio-header">
                            <div class="studio-badge">
                                <i data-lucide="message-circle" style="width: 14px; height: 14px;"></i>
                                <span>Contact</span>
                            </div>
                            <h1 class="studio-title">Get in touch</h1>
                            <p class="studio-description">Have questions or ready to transform your business with design
                                and development?</p>
                        </div>

                        <div class="studio-contact-list">
                            <!-- Email Card -->
                            <div class="studio-card">
                                <div class="card-icon"><i data-lucide="mail"></i></div>
                                <div class="card-details">
                                    <span class="card-label">Email us</span>
                                    <a href="mailto:ashifasherinkt54@gmail.com"
                                        class="card-value">ashifasherinkt54@gmail.com</a>
                                </div>
                                <div class="card-arrow"><i data-lucide="arrow-up-right"></i></div>
                            </div>

                        </div>
                    </div>

                    <!-- Right: Structured Form -->
                    <div class="studio-form-side">
                        <div class="studio-form-container">
                            <form id="contactForm" class="studio-form">
                                <div class="studio-field">
                                    <label for="name">Name</label>
                                    <input type="text" id="name" placeholder="Your name" required>
                                </div>

                                <div class="studio-field">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" placeholder="Your email" required>
                                </div>

                                <div class="studio-field">
                                    <label for="message">Subject</label>
                                    <input type="text" id="Subject" placeholder="Subject" required>
                                </div>

                                <div class="studio-field">
                                    <label for="message">Message</label>
                                    <textarea id="message" rows="6" placeholder="How can I help you?"
                                        required></textarea>
                                </div>

                                <button type="submit" class="studio-submit">
                                    <span>Submit</span>
                                </button>
                                <div id="formStatus" class="studio-status"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <!-- Footer -->
    <footer class="footer-premium-studio" id="footer">
        <div class="footer-noise"></div>

        <!-- Parallax Background Text -->
        <div class="footer-parallax-text">
            <span>LET'S TALK</span>
        </div>

        <div class="container footer-content-wrapper">
            <!-- Main CTA Area -->
            <div class="footer-main-cta">
                <span class="footer-label">HAVE A PROJECT IN MIND?</span>
                <a href="contact.html" class="studio-cta-link magnetic-btn">
                    <span class="btn-text" data-text="START A PROJECT">START A PROJECT</span>
                    <span class="btn-icon"><i data-lucide="arrow-up-right"></i></span>
                </a>
            </div>

            <!-- Bottom Bar -->
            <div class="footer-bottom-bar">
                <div class="f-left">
                    <span class="copyright">© 2026 ANFAS.</span>
                </div>

                <div class="f-center">
                    <a href="#" id="backToTop" class="back-to-top">
                        <span>BACK TO TOP</span>
                        <div class="icon-circle"><i data-lucide="arrow-up"></i></div>
                    </a>
                </div>

                <div class="f-right">
                    <div class="social-links-studio">
                        <a href="https://www.instagram.com/ashhiiifaa" aria-label="Instagram">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-instagram">
                                <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                                <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                            </svg>
                        </a>
                        <a href="https://www.linkedin.com/in/ashifa-sherin-k-339847318" aria-label="LinkedIn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-linkedin">
                                <path
                                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                                <rect width="4" height="12" x="2" y="9" />
                                <circle cx="4" cy="4" r="2" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
